name: Sync Aircraft

on:
  schedule:
    # Run mondays at 6:00 AM UTC
    - cron: '0 6 * * 1'

  # Allow manual trigger
  workflow_dispatch:

env:
  # Small updates (at or below both limits) are released automatically after
  # AUTO_RELEASE_DELAY_HOURS unless someone comments !hold or !reject on the
  # review issue. Larger updates always wait for a manual !release.
  AUTO_RELEASE_MAX_CHANGES: 50
  AUTO_RELEASE_MAX_REMOVALS: 25
  AUTO_RELEASE_DELAY_HOURS: 24

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run aircraft sync
      run: |
        echo "🔄 Starting automated aircraft sync..."
        python3 sync_aircraft.py

        echo "📊 Sync completed, checking for changes..."
        if [ -f "aircraft-staging.json" ]; then
          echo "✅ Staging file created successfully"

          # Validate the staging data before proceeding
          echo "🔍 Validating staging data against schema..."
          # Temporarily modify validate script to check staging file
          sed 's/aircraft\.json/aircraft-staging.json/' validate.py > validate_staging.py
          if python3 validate_staging.py; then
            echo "✅ Staging data validation passed"
            rm validate_staging.py
          else
            echo "❌ Staging data validation failed - aborting workflow"
            rm validate_staging.py
            exit 1
          fi

          # Check if there are meaningful changes (ignore timestamp differences)
          echo "🔍 Checking for meaningful changes in aircraft data..."
          # Compare only the aircraft arrays, ignoring timestamps
          PROD_COUNT=$(jq '.total_count' aircraft.json 2>/dev/null || echo "0")
          STAGING_COUNT=$(jq '.total_count' aircraft-staging.json)
          PROD_AIRCRAFT=$(jq -S '.aircraft' aircraft.json 2>/dev/null || echo "[]")
          STAGING_AIRCRAFT=$(jq -S '.aircraft' aircraft-staging.json)

          if [ "$PROD_COUNT" != "$STAGING_COUNT" ] || [ "$PROD_AIRCRAFT" != "$STAGING_AIRCRAFT" ]; then
            echo "🔍 Meaningful changes detected in aircraft data"
            echo "📋 Changes will be available for manual review"

            # Create a summary of changes for the commit
            python3 review_changes.py --limit "$AUTO_RELEASE_MAX_CHANGES" > changes_summary.txt || true

            # Decide whether the changes are small enough for auto-release
            # (falls back to manual review if the check itself fails)
            python3 check_auto_release.py || echo "AUTO_RELEASE=false" >> $GITHUB_ENV
            echo "STAGING_SHA256=$(sha256sum aircraft-staging.json | cut -d' ' -f1)" >> $GITHUB_ENV
            echo "PRODUCTION_SHA256=$(sha256sum aircraft.json 2>/dev/null | cut -d' ' -f1)" >> $GITHUB_ENV

            echo "CHANGES_DETECTED=true" >> $GITHUB_ENV
          else
            echo "✅ No changes detected - staging matches production"
            echo "CHANGES_DETECTED=false" >> $GITHUB_ENV
          fi
        else
          echo "❌ Staging file not created - sync may have failed"
          exit 1
        fi

    - name: Commit staging changes
      if: env.CHANGES_DETECTED == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Aircraft Sync Bot"

        git add aircraft-staging.json
        git add changes_summary.txt 2>/dev/null || true

        # Create descriptive commit message
        STAGING_COUNT=$(jq '.total_count' aircraft-staging.json)
        PROD_COUNT=$(jq '.total_count' aircraft.json 2>/dev/null || echo "0")
        CHANGE_COUNT=$((STAGING_COUNT - PROD_COUNT))

        git commit -m "🤖 Auto-sync: Update aircraft staging data

        📊 Total aircraft: ${STAGING_COUNT}
        📈 Change count: ${CHANGE_COUNT:+${CHANGE_COUNT}}
        🕐 Sync time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')

        📋 See the automated-sync issue to review, hold or reject
        Run 'python3 review_changes.py' to see changes
        Run 'python3 release.py' to promote to production"

        echo "📝 Staged changes committed"

    - name: Push changes
      if: env.CHANGES_DETECTED == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}

    - name: Create Issue for Review
      if: env.CHANGES_DETECTED == 'true'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');

          // Close any existing open automated-sync issues first
          console.log("🔍 Checking for existing open automated-sync issues...");
          const existingIssues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'automated-sync'
          });

          // A hold or a rejection carries over to the next update, because those changes are
          // still part of the new staging data. The newest earlier update decides: it blocks
          // auto-release if it was put on hold, rejected, or closed by hand without a release.
          const { data: [previous] } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'all',
            labels: 'automated-sync',
            per_page: 1
          });
          const previousLabels = previous ? previous.labels.map(label => label.name) : [];
          const carriedOver = previous && (
            previousLabels.includes('on-hold') || previousLabels.includes('rejected') ||
            (previous.state === 'closed' && !previousLabels.includes('released') && !previousLabels.includes('superseded'))
          ) ? previous : null;

          if (existingIssues.data.length > 0) {
            console.log(`📝 Found ${existingIssues.data.length} existing open automated-sync issues`);

            for (const issue of existingIssues.data) {
              console.log(`🔒 Closing stale issue #${issue.number}: ${issue.title}`);
              const held = issue.labels.some(label => label.name === 'on-hold');
              const holdNote = held ? '\n⏸️ **The hold carries over**: the new issue also waits for a manual release.\n' : '';

              // Add a comment explaining why it's being closed
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `## 🔄 Superseded by Newer Sync

                This issue has been automatically closed because a newer sync has detected changes.

                **Only the latest staging data is relevant for releases.**
                ${holdNote}
                ➡️ Please refer to the newest automated-sync issue for current changes.

                ---
                *🤖 Auto-closed by sync workflow*`
              });

              // Close the issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                labels: held ? ['automated-sync', 'superseded', 'on-hold'] : ['automated-sync', 'superseded']
              });
            }

            console.log("✅ All previous automated-sync issues have been closed");
          } else {
            console.log("✅ No existing open automated-sync issues found");
          }

          let changesSummary = "Changes summary not available";
          try {
            changesSummary = fs.readFileSync('changes_summary.txt', 'utf8');
          } catch (e) {
            console.log("Could not read changes summary");
          }

          // Small updates get a due time; the release workflow's hourly check
          // releases them once it has passed, unless the issue was held/rejected.
          // The staging hash ensures exactly the reviewed data gets released.
          const autoRelease = process.env.AUTO_RELEASE === 'true' && !carriedOver;
          const dueAt = new Date(Date.now() + Number(process.env.AUTO_RELEASE_DELAY_HOURS) * 60 * 60 * 1000);
          const dueText = dueAt.toISOString().substring(0, 16).replace('T', ' ') + ' UTC';

          const manualReason = carriedOver
            ? `the previous update #${carriedOver.number} was ${previousLabels.includes('on-hold') ? 'put on hold' : previousLabels.includes('rejected') ? 'rejected' : 'closed without a release'} and its changes may be part of this one`
            : process.env.AUTO_RELEASE_REASON || 'the auto-release check did not complete';

          const reviewSection = autoRelease ? `
          ## ⏰ Auto-Release Scheduled

          This is a small update (${process.env.AUTO_RELEASE_REASON}), so it will be **released automatically as a patch on ${dueText}** unless someone with write access comments:

          - \`!hold\` - Don't release automatically, keep this issue open for a manual decision
          - \`!reject\` or \`!reject Reason\` - Discard these changes
          - \`!release patch\` - Release right away

          <!-- auto-release due=${dueAt.toISOString()} staging-sha256=${process.env.STAGING_SHA256} production-sha256=${process.env.PRODUCTION_SHA256} -->
          ` : `
          ## ✋ Manual Review Required

          These changes will not be released automatically: ${manualReason}.
          `;

          const issueTitle = autoRelease
            ? `🤖 Aircraft Registry Update Available - Auto-Release Scheduled`
            : `🤖 Aircraft Registry Update Available - Manual Review Required`;
          const issueBody = `
          ## 🔄 Automated Sync Completed

          A new aircraft registry sync has been completed and is ready for your review.
          ${reviewSection}
          ## 📋 Changes Summary

          \`\`\`
          ${changesSummary}
          \`\`\`

          ## 🚀 Next Steps - Choose Your Release Method

          ### 🤖 **Automated Release (Recommended)**

          **To approve and release**: Comment on this issue with:
          - \`!release patch\` - For data updates, new aircraft, corrections
          - \`!release minor\` - For new fields, backward-compatible changes  
          - \`!release major\` - For breaking changes, schema updates
          - Add optional description: \`!release patch Fixed aircraft data\`

          **To reject**: Comment \`!reject\` or \`!reject Reason for rejection\`

          **To stop an automatic release** and decide later: Comment \`!hold\`

          The automated workflow will handle version bumping, backups, and release automatically!

          ### 🖥️ **Manual Release (Legacy)**

          1. **Review changes**: Run \`python3 review_changes.py\`
          2. **If approved**: Run \`python3 release.py\`
          3. **If rejected**: Comment \`!reject\` (small updates are otherwise released automatically)

          ## 📁 Files Modified

          - \`aircraft-staging.json\` - Updated with latest data
          - \`changes_summary.txt\` - Detailed change report

          ## ⏰ Sync Details

          - **Sync Time**: ${new Date().toISOString()}
          - **Workflow**: ${context.runId}
          - **Commit**: ${context.sha.substring(0, 7)}

          ---

          This issue was created automatically and is closed automatically when the changes are released or rejected. Closing it by hand cancels a scheduled automatic release.
          `;

          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: issueTitle,
            body: issueBody,
            labels: autoRelease ? ['automated-sync', 'auto-release']
              : carriedOver ? ['automated-sync', 'review-required', 'on-hold']
              : ['automated-sync', 'review-required']
          });

    - name: No changes detected
      if: env.CHANGES_DETECTED == 'false'
      run: |
        echo "✅ No changes detected - aircraft registry is up to date"
        echo "📊 No action required"
